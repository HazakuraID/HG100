name: Game Helio G100 Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '17', cache: gradle}
    - uses: android-actions/setup-android@v3
    - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '8.10'}
    - run: gradle clean                           # <-- ADD THIS LINE
    - run: gradle :app:assembleRelease
    - run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
    - run: sha256sum app/build/outputs/apk/release/app-release.apk
    - uses: actions/upload-artifact@v4
      with:
        name: GameHelioG100-API36-release
        path: app/build/outputs/apk/release/app-release.apk
    - if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
